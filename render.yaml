# Render Blueprint: https://render.com/docs/blueprint-spec
# Render → New → Blueprint → pick this repo. Secrets marked `sync: false`
# are asked for in the Render dashboard (they are never stored in git).
services:
  - type: web
    name: real-estate-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    # Applies pending migrations and upserts lookup data + admin, then starts the API.
    startCommand: npm run start:deploy
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLOUDINARY_FOLDER
        value: real-estate
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL # Neon connection string (direct, not pooled)
        sync: false
      - key: CORS_ORIGINS # e.g. http://localhost:5173,https://your-frontend.vercel.app
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
